<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Nest - Add New Recipe</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html"><img src="images/logo.jpg" class="imge"> Recipe Nest</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="recipe.html">Recipe</a></li>
        <li class="nav-item"><a class="nav-link active" href="add-recipe.html">Add New</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5 add-recipe-container">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="text-center">Share Your Secret Recipe</h2>
      <p class="text-center text-muted">Contribute your food entry to the directory feed view</p>

      <form id="recipeForm" novalidate>
        <div class="mb-3">
          <label for="recipeName" class="form-label fw-bold">Recipe Name</label>
          <input type="text" class="form-control" id="recipeName" placeholder="e.g. Spicy Cream Pasta">
          <div class="invalid-feedback">Recipe name must be at least 5 letters.</div>
        </div>

        <div class="mb-3">
          <label for="mealCategory" class="form-label fw-bold">Meal Category</label>
          <select class="form-select" id="mealCategory">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="ingredients" class="form-label fw-bold">Ingredients</label>
          <textarea class="form-control" id="ingredients" rows="3" placeholder="List key ingredients...."></textarea>
          <div class="invalid-feedback">Please list at least one ingredient.</div>
        </div>

        <div class="mb-3">
          <label for="instructions" class="form-label fw-bold">Instructions</label>
          <textarea class="form-control" id="instructions" rows="4" placeholder="Step-by-step description......"></textarea>
          <div class="invalid-feedback">Please add the preparation steps.</div>
        </div>

        <button type="submit" class="btn btn-danger w-100">Publish Instantly</button>
      </form>
    </div>
  </div>
</div>

<footer class="text-center py-4">
  <p class="mb-0">&copy; 2026 Recipe Nest. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
